name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/moodle-cli
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        run: |
          node - <<'JS'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const tag = process.env.GITHUB_REF_NAME;
          const expected = `v${pkg.version}`;
          if (pkg.name !== "moodle-cli") {
            throw new Error(`Refusing to release unexpected package name: ${pkg.name}`);
          }
          if (tag !== expected) {
            throw new Error(`Tag ${tag} does not match package version ${expected}`);
          }
          console.log(`Validated release tag ${tag} for ${pkg.name}`);
          JS

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Bundle npm package
        run: npm run build

      - name: Check SKILL.md drift
        run: |
          npm run skill:generate
          git diff --exit-code SKILL.md

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build standalone binaries
        run: |
          mkdir -p dist/bin
          bun build ./src/cli.ts --compile --target=bun-darwin-arm64 --outfile dist/bin/moodle-darwin-arm64
          bun build ./src/cli.ts --compile --target=bun-linux-x64 --outfile dist/bin/moodle-linux-x64
          chmod +x dist/bin/moodle-*

      - name: Resolve release notes file
        id: notes
        run: |
          version_tag="${GITHUB_REF_NAME#v}"
          notes_file=".github/release-notes/${version_tag}.md"
          if [ -f "${notes_file}" ]; then
            echo "has_manual_notes=true" >> "$GITHUB_OUTPUT"
            echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"
          else
            echo "has_manual_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release with manual notes
        if: steps.notes.outputs.has_manual_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.notes_file }}
          files: |
            dist/bin/moodle-darwin-arm64
            dist/bin/moodle-linux-x64

      - name: Publish GitHub release with generated notes
        if: steps.notes.outputs.has_manual_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/bin/moodle-darwin-arm64
            dist/bin/moodle-linux-x64
